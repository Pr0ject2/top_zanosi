<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-59GX4YGKMR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

        gtag('config', 'G-59GX4YGKMR');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP ZANOSI - Проекты из выпусков</title>
    <meta name="description" content="Проекты из выпусков TOP ZANOSI.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0c10;
            --panel: rgba(20, 22, 29, 0.72);
            --panel-strong: rgba(18, 20, 27, 0.94);
            --border: rgba(255, 255, 255, 0.07);
            --border-strong: rgba(255, 183, 3, 0.22);
            --text: #ffffff;
            --muted: #9ca4b5;
            --accent: #ffb703;
            --accent-2: #ff8c42;
            --shadow: 0 22px 54px rgba(0, 0, 0, 0.46);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-width: 320px;
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255, 183, 3, 0.1), transparent 28%),
                radial-gradient(circle at 80% 10%, rgba(255, 140, 66, 0.08), transparent 24%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 42px 42px, 42px 42px;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body.modal-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        .container {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 20px 0 56px;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 18px 0 26px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: -0.04em;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent);
        }

        nav ul {
            display: flex;
            align-items: center;
            gap: 16px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: #b4bccb;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 999px;
            transition: color 0.2s ease, background 0.2s ease;
        }

        nav a:hover,
        nav a:focus-visible {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            outline: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .hero {
            position: relative;
            padding: 42px 0 12px;
        }

        .hero-copy h1 {
            margin: 0 0 12px;
            font-size: clamp(42px, 7vw, 76px);
            line-height: 0.94;
            letter-spacing: -0.06em;
            font-weight: 900;
            text-transform: uppercase;
        }

        .hero-copy p {
            margin: 0;
            max-width: 520px;
            color: var(--muted);
            font-size: 16px;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: min(440px, 48vw);
            height: 180px;
            right: 0;
            top: 18px;
            border-radius: 999px;
            background:
                radial-gradient(circle at 24% 50%, rgba(255, 183, 3, 0.16), transparent 36%),
                radial-gradient(circle at 78% 45%, rgba(255, 140, 66, 0.13), transparent 34%);
            filter: blur(8px);
            pointer-events: none;
            z-index: 0;
        }

        .hero-copy {
            position: relative;
            z-index: 1;
            max-width: 640px;
        }

        .panel {
            margin-top: 24px;
            padding: 30px;
            border-radius: 24px;
            background: var(--panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
        }

        .featured-card {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
            gap: 22px;
            padding: 28px;
            border-radius: 22px;
            background:
                linear-gradient(135deg, rgba(255, 183, 3, 0.08), transparent 42%),
                var(--panel-strong);
            border: 1px solid var(--border-strong);
            position: relative;
            overflow: hidden;
        }

        .featured-card::after {
            content: "";
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 183, 3, 0.12), transparent 68%);
            right: -140px;
            bottom: -180px;
            pointer-events: none;
        }

        .featured-main,
        .featured-side {
            position: relative;
            z-index: 1;
        }

        .featured-top {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 18px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .featured-logo {
            width: 220px;
            min-width: 220px;
            height: 132px;
            padding: 2px;
            border-radius: 18px;
            background: rgba(9, 11, 15, 0.46);
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.015);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .featured-logo img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: center;
            transform: scale(var(--logo-scale, 1.08));
        }

        .featured-top .badge {
            margin-bottom: 0;
            order: 2;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(255, 183, 3, 0.12);
            border: 1px solid rgba(255, 183, 3, 0.18);
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
            transform: translateY(-4px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .stat {
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stat-value {
            display: block;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.35;
            word-break: break-word;
        }

        .featured-side {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 18px;
            padding: 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .featured-side-block {
            display: grid;
            gap: 10px;
        }

        .promo-block {
            display: grid;
            gap: 8px;
            padding: 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .promo-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .promo-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .promo-code {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 14px;
            background: rgba(10, 12, 17, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.07);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        .copy-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
        }

        .copy-button:hover,
        .copy-button:focus-visible {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
            outline: none;
        }

        .copy-status {
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(2px);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .copy-status.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .featured-line {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .featured-line:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .featured-line span:first-child {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .featured-line span:last-child {
            text-align: right;
            font-size: 14px;
            font-weight: 700;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 22px;
        }

        .section-head h2 {
            margin: 0;
            font-size: 28px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .project-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100%;
            padding: 20px;
            border-radius: 20px;
            background: rgba(14, 16, 22, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .project-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 183, 3, 0.22);
            box-shadow: 0 18px 32px rgba(0, 0, 0, 0.28);
        }

        .project-top {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
        }

        .project-logo {
            width: 168px;
            min-width: 168px;
            height: 96px;
            padding: 2px;
            border-radius: 16px;
            background: rgba(9, 11, 15, 0.46);
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.015);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .project-logo img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: center;
            transform: scale(var(--logo-scale, 1.06));
        }

        .featured-logo img.logo-image--boost {
            --logo-scale: 1.14;
        }

        .project-logo img.logo-image--boost {
            --logo-scale: 1.12;
        }

        .featured-logo img.logo-image--boost-strong {
            --logo-scale: 1.22;
        }

        .project-logo img.logo-image--boost-strong {
            --logo-scale: 1.18;
        }

        .featured-logo img.logo-image--boost-max {
            --logo-scale: 1.3;
        }

        .project-logo img.logo-image--boost-max {
            --logo-scale: 1.24;
        }

        .project-list {
            display: grid;
            gap: 10px;
        }

        .project-row {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            padding: 11px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .project-row span:first-child {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .project-row span:last-child {
            text-align: right;
            font-size: 14px;
            font-weight: 700;
        }

        .project-row--promo {
            align-items: center;
        }

        .project-promo-inline {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .project-promo-code {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 10px;
            border-radius: 10px;
            background: rgba(10, 12, 17, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.07);
            letter-spacing: 0.1em;
            font-size: 13px;
            font-weight: 800;
        }

        .copy-button--small {
            min-height: 32px;
            padding: 0 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .btn-primary,
        .btn-secondary,
        .btn-link {
            appearance: none;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
        }

        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 20px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 800;
            text-align: center;
            border: 1px solid transparent;
        }

        .btn-content {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: #161107;
        }

        .btn-primary:hover,
        .btn-primary:focus-visible {
            transform: translateY(-1px);
            background: #ffc233;
            outline: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border-color: rgba(255, 183, 3, 0.46);
        }

        .btn-secondary:hover,
        .btn-secondary:focus-visible {
            transform: translateY(-1px);
            background: rgba(255, 183, 3, 0.08);
            outline: none;
        }

        .btn-link {
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            text-decoration: underline;
            text-decoration-color: rgba(255, 255, 255, 0.16);
            text-underline-offset: 3px;
        }

        .btn-link:hover,
        .btn-link:focus-visible {
            color: var(--text);
            outline: none;
        }

        .telegram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .telegram-link:hover,
        .telegram-link:focus-visible {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.16);
            outline: none;
        }

        .icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            flex: 0 0 18px;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-fill svg {
            fill: currentColor;
            stroke: none;
        }

        footer {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
        }

        .footer-links a {
            color: #c2c9d6;
            text-decoration: underline;
            text-decoration-color: rgba(255, 255, 255, 0.16);
            text-underline-offset: 3px;
        }

        .footer-links a:hover,
        .footer-links a:focus-visible {
            color: var(--text);
            outline: none;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.84);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 30;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: min(760px, 100%);
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            background: #14161d;
            border: 1px solid rgba(255, 183, 3, 0.24);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 26px 56px rgba(0, 0, 0, 0.56);
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 22px 22px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-title {
            margin: 0;
            font-size: 26px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 22px;
        }

        .modal-close:hover,
        .modal-close:focus-visible {
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        .modal-body {
            overflow: auto;
            padding: 14px 22px 22px;
        }

        .terms-table {
            width: 100%;
            border-collapse: collapse;
        }

        .terms-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .terms-table td {
            padding: 13px 0;
            vertical-align: top;
        }

        .terms-table td:first-child {
            width: 38%;
            padding-right: 18px;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
        }

        .terms-table td:last-child {
            color: var(--muted);
            font-size: 14px;
            word-break: break-word;
        }

        @media (max-width: 980px) {
            .featured-card {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            .container {
                width: min(100% - 24px, 1120px);
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                padding-bottom: 22px;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            nav ul {
                flex-wrap: wrap;
                gap: 10px;
            }

            .panel,
            .featured-card {
                padding: 20px;
            }

            .stats,
            .projects-grid {
                grid-template-columns: 1fr;
            }

            .featured-logo {
                width: 190px;
                min-width: 190px;
                height: 118px;
            }

            .project-logo {
                width: 152px;
                min-width: 152px;
                height: 88px;
            }
        }

        @media (max-width: 520px) {
            .hero {
                padding-top: 30px;
            }

            .project-row,
            .featured-line,
            .actions {
                flex-direction: column;
                align-items: flex-start;
            }

            .promo-row {
                align-items: stretch;
            }

            .copy-button {
                width: 100%;
                justify-content: center;
            }

            .project-row span:last-child,
            .featured-line span:last-child {
                text-align: left;
            }

            .project-promo-inline {
                justify-content: flex-start;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
            }

            .terms-table td:first-child,
            .terms-table td:last-child {
                display: block;
                width: 100%;
                padding-right: 0;
            }

            .terms-table td:first-child {
                padding-bottom: 6px;
            }

            .terms-table td:last-child {
                padding-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a class="logo" href="#top">TOP <span>ZANOSI</span></a>
            <div class="header-actions">
                <nav aria-label="Навигация">
                    <ul>
                        <li><a href="#projects">Проекты</a></li>
                    </ul>
                </nav>

            termsModal.classList.remove("active");
            termsModal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");
        }

        document.addEventListener("click", (event) => {
            const trigger = event.target.closest("[data-open-terms]");

            if (trigger) {
                openTerms(trigger.getAttribute("data-open-terms"));
                return;
            }

            const copyButton = event.target.closest("[data-copy-text]");

            if (copyButton) {
                const status = copyButton.closest(".promo-block")?.querySelector("[data-copy-status]");
                copyToClipboard(copyButton.getAttribute("data-copy-text"))
                    .then(() => {
                        if (!status) {
                            return;
                        }

                        status.classList.add("visible");
                        window.clearTimeout(status._copyTimer);
                        status._copyTimer = window.setTimeout(() => {
                            status.classList.remove("visible");
                        }, 1600);
                    })
                    .catch(() => {});
                return;
            }

            if (event.target === termsModal) {
                closeTerms();
            }
        });

        termsClose.addEventListener("click", closeTerms);

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && termsModal.classList.contains("active")) {
                closeTerms();
            }
        });

        renderFeaturedProject(featuredProject);
        renderSecondaryProjects(secondaryProjects);
        telegramLinks.forEach((link) => {
            link.href = TELEGRAM_URL;
        });
    </script>
</body>
</html>
