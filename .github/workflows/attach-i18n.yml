name: Attach localization script

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach i18n.js
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '    <script src="i18n.js"></script>\n'
          if 'src="i18n.js"' not in text:
              text = text.replace('</body>', tag + '</body>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "Localization script already attached"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable browser language localization"
          git push
