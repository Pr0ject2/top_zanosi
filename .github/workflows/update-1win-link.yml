name: Update 1win link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace 1win URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'https://lkfg.pro/87545fd2'
          new = 'https://viazento.link/top'
          if old not in text:
              print('Old URL not found; nothing to replace')
          else:
              p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace 1win link"
          git push
