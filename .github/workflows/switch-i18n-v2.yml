name: Switch localization bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch bundle and remove old cache target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="i18n.js"></script>'
          new = '<script src="i18n-v2.js?v=20260924-1"></script>'
          if old in text:
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          rm -f i18n.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Already switched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html i18n.js
          git commit -m "Enable refreshed English localization"
          git push
