name: Add Stake casino

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-stake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          if 'name: "Stake"' not in text:
              stake_block = '''            },
            {
                id: "12",
                name: "Stake",
                logoUrl: "stake-logo.svg",
                logoClass: "logo-image--boost",
                bonusText: "Приветственный бонус",
                bonusExtra: "",
                promoCode: "topzanosi",
                link: "https://stake.com/?c=topzanosi",
                terms: [
                    { label: "Мин. депозит", value: "Зависит от валюты и способа оплаты" },
                    { label: "Мин. сумма вывода", value: "Указывается при выводе" },
                    { label: "Валюта счета", value: "Криптовалюты и доступные фиатные валюты" },
                    { label: "Лимит на вывод средств", value: "Зависит от валюты, метода и статуса аккаунта" },
                    { label: "Способы пополнения", value: "Криптовалюта и доступные фиатные методы" },
                    { label: "Способы вывода", value: "Криптовалюта и доступные фиатные методы" },
                    { label: "Скорость выплат", value: "Зависит от валюты, сети и метода" }
                ]
            }'''
              marker = '''            }
        ];

        const featuredProjectRoot'''
              if marker not in text:
                  raise SystemExit("projectsData insertion marker not found")
              text = text.replace(marker, stake_block + '''
        ];

        const featuredProjectRoot''', 1)

          text = text.replace(
              'i18n-v2.js?v=20260924-1',
              'i18n-v2.js?v=20261101-1'
          )
          index.write_text(text, encoding="utf-8")

          i18n = Path("i18n-v2.js")
          js = i18n.read_text(encoding="utf-8")

          if '["Приветственный бонус", "Welcome offer"]' not in js:
              old = '["425% на депозит + 230 FS", "Up to 425% + 230 FS"]\n    ]);'
              new = '["425% на депозит + 230 FS", "Up to 425% + 230 FS"],\n        ["Приветственный бонус", "Welcome offer"]\n    ]);'
              if old not in js:
                  raise SystemExit("translation insertion marker not found")
              js = js.replace(old, new, 1)

          if '"12": {' not in js:
              stake_en = '''        "12": {
            "Мин. депозит": "Varies by currency and payment method",
            "Мин. сумма вывода": "Shown in the withdrawal interface",
            "Валюта счета": "Cryptocurrencies and supported fiat currencies",
            "Лимит на вывод средств": "Varies by currency, method and account status",
            "Способы пополнения": "Crypto and available fiat payment methods",
            "Способы вывода": "Crypto and available fiat withdrawal methods",
            "Скорость выплат": "Varies by currency, network and method"
        }'''
              pattern = re.compile(r'(\n        "10": \{.*?\n        \})(\n    \};)', re.S)
              match = pattern.search(js)
              if not match:
                  raise SystemExit("englishTerms insertion marker not found")
              js = js[:match.start()] + match.group(1) + ',\n' + stake_en + match.group(2) + js[match.end():]

          i18n.write_text(js, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html i18n-v2.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html i18n-v2.js
          git commit -m "Add Stake casino"
          git push
